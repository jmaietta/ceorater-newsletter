<!-- Preview Banner - Only shown in preview emails to admin -->
<tr>
  <td style="padding: 24px 40px; background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border-bottom: 2px solid #f59e0b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
      <tr>
        <td>
          <p style="margin: 0 0 8px 0; font-size: 14px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: 0.05em;">
            ⚠️ Preview — Not Yet Sent
          </p>
          <p style="margin: 0 0 16px 0; font-size: 14px; color: #78350f;">
            This is how your newsletter will appear to subscribers. Will send to <strong>{{SUBSCRIBER_COUNT}} subscribers</strong>.
          </p>
        </td>
      </tr>
      <tr>
        <td>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <!-- Approve Button -->
              <td style="padding-right: 12px;">
                <a href="{{APPROVE_URL}}" style="display: inline-block; padding: 12px 24px; background-color: #16a34a; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 6px;">
                  ✓ Send to Subscribers
                </a>
              </td>
              <!-- Skip Button -->
              <td>
                <a href="{{CANCEL_URL}}" style="display: inline-block; padding: 12px 24px; background-color: #dc2626; color: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; border-radius: 6px;">
                  ✕ Skip This Article
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>
